apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      upstream catalog_backend {
        # Primary local Minikube service
        server catalog-service.default.svc.cluster.local:8001;
        # Cloud failover trigger
        server 40.81.254.69:80 backup;
      }
      upstream order_backend {
        # Primary local Minikube service
        server order-service.default.svc.cluster.local:8002;
        # Cloud failover trigger
        server 20.204.204.99:80 backup;
      }
      server {
        listen 80;
        location /catalog {
          proxy_pass http://catalog_backend;
        }
        location /order {
          proxy_pass http://order_backend;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: api-gateway